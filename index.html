<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shot Clock + Blinds (Display-only & Silent)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body { font-family: 'Noto Sans', sans-serif; }
    /* Display-only: disable text selection everywhere */
    * { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .slide-in { transition: transform .25s ease; }
    .hidden-sidebar { transform: translateX(-100%); }
    .visible-sidebar { transform: translateX(0); }
  </style>
  <script>
    // Ensure toggleSidebar exists before DOM loads
    window.toggleSidebar = function(){
      var sidebar = document.getElementById('sidebar');
      if(!sidebar){
        document.addEventListener('DOMContentLoaded', function(){
          var sb = document.getElementById('sidebar');
          if(!sb) return;
          sb.classList.toggle('visible-sidebar');
          sb.classList.toggle('hidden-sidebar');
        }, { once: true });
        return;
      }
      sidebar.classList.toggle('visible-sidebar');
      sidebar.classList.toggle('hidden-sidebar');
    };
  </script>
</head>
<body class="h-full bg-[hsl(13,45%,25%)] text-white">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="slide-in hidden-sidebar fixed inset-y-0 left-0 z-40 w-96 max-w-[85vw] bg-gray-800/95 backdrop-blur p-4 overflow-auto shadow-2xl border-r border-white/10">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold">ตั้งค่า</h2>
        <button type="button" onclick="toggleSidebar()" class="px-2 py-1 rounded bg-white/10">⟨⟨</button>
      </div>

      <!-- Shot Clock Settings -->
      <section class="mb-6">
        <h3 class="text-lg font-semibold mb-2">Shot Clock</h3>
        <div class="space-y-2 text-sm">
          <label class="block">ความยาวต่อรอบ (วินาที)
            <input id="shotLen" type="number" min="5" class="w-full bg-gray-700 rounded px-2 py-1" oninput="updateShotLength()" />
          </label>
        </div>
      </section>

      <!-- Blind Settings -->
      <section class="mb-6">
        <h3 class="text-lg font-semibold mb-2">ระดับ Blind</h3>
        <div class="flex gap-4 text-xs text-gray-300 font-semibold mb-1 pl-2">
          <span class="w-16 text-center">SB</span>
          <span class="w-16 text-center">BB</span>
          <span class="w-16 text-center">Min</span>
        </div>
        <div id="blindsList" class="space-y-2"></div>
        <button type="button" onclick="addBlind()" class="mt-2 bg-indigo-800 px-4 py-2 rounded w-full">+ เพิ่ม Blind</button>
      </section>

      <!-- Timer Controls -->
      <section class="mb-2">
        <h3 class="text-lg font-semibold mb-2">Blind Timer</h3>
        <div class="flex gap-2">
          <button type="button" onclick="startBlindTimer()" class="flex-1 bg-blue-600 rounded px-3 py-2">Start</button>
          <button type="button" onclick="togglePause()" id="pauseBtn" class="flex-1 bg-yellow-600 rounded px-3 py-2">Pause</button>
        </div>
        <button type="button" onclick="resetAll()" class="mt-2 w-full bg-rose-700 rounded px-3 py-2">Reset time</button>
      </section>
    </aside>

    <!-- Main -->
    <main class="flex-1 relative flex flex-col items-center justify-center text-center px-4">
      <button type="button" onclick="toggleSidebar()" class="absolute top-4 left-4 bg-sky-600 hover:bg-sky-500 px-3 py-1 rounded shadow z-50">☰</button>
      <button type="button" id="fsBtn" onclick="toggleFullscreen()" class="absolute top-4 right-4 bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded shadow z-50">⛶ Full Screen</button>

      <!-- Shot Clock (ใหญ่) -->
      <div class="flex flex-col items-center select-none">
        <div id="shotTime" class="font-extrabold leading-none" style="font-size: clamp(12rem, 50vw, 40rem);">00</div>
      </div>

      <!-- Divider -->
      <div class="h-6 md:h-8"></div>

      <!-- Blinds (เล็กกว่า) -->
      <div class="w-full max-w-screen-xl grid grid-cols-1 md:grid-cols-2 items-stretch gap-1 md:gap-2">
        <div class="order-2 md:order-1 bg-white/5 rounded-2xl p-4 md:p-6 backdrop-blur border border-white/10 shadow flex flex-col justify-center">
          <div class="text-sm uppercase tracking-wide text-white/70">Current Blind</div>
          <div id="currentBlind" class="text-[2rem] sm:text-[2rem] md:text-[4rem] font-semibold break-words">100 / 200</div>
          <div id="currentLevel" class="mt-1 text-lg text-white/80">Level 1 / 3</div>
          <div class="mt-2 h-px w-full bg-white/10"></div>
          <div class="mt-2 text-sm uppercase tracking-wide text-white/70">Next Blind</div>
          <div id="nextBlind" class="text-[1.5rem] sm:text-[1.75rem] md:text-[2rem]">200 / 400</div>
        </div>
        <div class="order-1 md:order-2 bg-white/5 rounded-2xl p-4 md:p-6 backdrop-blur border border-white/10 shadow flex flex-col items-center justify-center">
          <div class="text-sm uppercase tracking-wide text-white/70">Blind Clock</div>
          <div id="blindTime" class="mt-1 text-[2.5rem] sm:text-[4rem] md:text-[8rem] text-white/90 leading-none">20:00</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let blinds = JSON.parse(localStorage.getItem('blinds')) || [
      { sb: 100, bb: 200, duration: 20 },
      { sb: 200, bb: 400, duration: 20 },
      { sb: 300, bb: 600, duration: 20 }
    ];
    let currentBlindIndex = parseInt(localStorage.getItem('currentBlindIndex') || '0');
    let blindTimer = (blinds[currentBlindIndex]?.duration || 20) * 60;
    let blindInterval = null;
    let blindPaused = false;

    let shotLen = parseInt(localStorage.getItem('shotLen') || '30');
    let shotEnd = 0;
    let rafId = null;
    let lastShown = -1;

    const elShot = document.getElementById('shotTime');
    const elBlind = document.getElementById('blindTime');
    const elCur = document.getElementById('currentBlind');
    const elNext = document.getElementById('nextBlind');
    const elLevel = document.getElementById('currentLevel');
    const pauseBtn = document.getElementById('pauseBtn');
    const inputShotLen = document.getElementById('shotLen');
    inputShotLen.value = shotLen;

    window.addBlind = function(){
      blinds.push({ sb: 0, bb: 0, duration: 20 });
      save();
      renderBlinds();
      renderDisplay();
    };

    window.deleteBlind = function(i){
      blinds.splice(i,1);
      currentBlindIndex = Math.max(0, Math.min(currentBlindIndex, blinds.length-1));
      save();
      renderBlinds();
      renderDisplay();
    };

    window.moveBlind = function(i, dir){
      const j = i + dir;
      if (j < 0 || j >= blinds.length) return;
      const [item] = blinds.splice(i,1);
      blinds.splice(j,0,item);
      if (currentBlindIndex === i) currentBlindIndex = j;
      else if (currentBlindIndex === j) currentBlindIndex = i;
      save();
      renderBlinds();
      renderDisplay();
    };

    window.updateBlind = function(i, key, val){
      blinds[i][key] = parseInt(val)||0;
      if(key==='duration' && i===currentBlindIndex){
        blindTimer = blinds[i].duration*60;
        renderBlindTime();
      }
      save();
      renderDisplay();
    };

    function renderBlinds(){
      const list = document.getElementById('blindsList');
      list.innerHTML = '';
      blinds.forEach((b,i)=>{
        list.innerHTML += `
          <div class="flex items-center gap-2 bg-gray-700/30 p-2 rounded">
            <input type="number" value="${b.sb}" oninput="updateBlind(${i},'sb',this.value)" class="w-16 bg-gray-700 rounded px-2 py-1">
            <input type="number" value="${b.bb}" oninput="updateBlind(${i},'bb',this.value)" class="w-16 bg-gray-700 rounded px-2 py-1">
            <input type="number" value="${b.duration}" oninput="updateBlind(${i},'duration',this.value)" class="w-16 bg-gray-700 rounded px-2 py-1">
            <div class="ml-auto flex items-center gap-1">
              <button type="button" onclick="moveBlind(${i}, -1)" class="px-2 text-white/80 bg-white/10 rounded">▲</button>
              <button type="button" onclick="moveBlind(${i}, 1)" class="px-2 text-white/80 bg-white/10 rounded">▼</button>
              <button type="button" onclick="deleteBlind(${i})" class="px-3 py-1 text-white bg-red-600 hover:bg-red-700 rounded text-lg font-bold">✖</button>
            </div>
          </div>`;
      });
    }

    function renderDisplay(){
      const cur = blinds[currentBlindIndex] || {sb:0, bb:0, duration:0};
      const next = blinds[currentBlindIndex+1];
      const isBreak = cur.sb===0 && cur.bb===0;
      elCur.textContent = isBreak ? 'Break Time' : `${cur.sb} / ${cur.bb}`;
      elNext.textContent = next? `${next.sb} / ${next.bb}` : 'เลเวลสุดท้าย';
      elLevel.textContent = `Level ${currentBlindIndex+1} / ${blinds.length}`;
      renderBlindTime();
    }

    function renderBlindTime(){
      const m = String(Math.floor(blindTimer/60)).padStart(2,'0');
      const s = String(blindTimer%60).padStart(2,'0');
      elBlind.textContent = `${m}:${s}`;
    }

    window.startBlindTimer = function(){
      if(blindInterval) return;
      blindInterval = setInterval(()=>{
        if(blindPaused) return;
        if(blindTimer>0){
          blindTimer--;
          renderBlindTime();
          save();
        }else{
          if(currentBlindIndex < blinds.length-1){
            currentBlindIndex++;
            blindTimer = (blinds[currentBlindIndex].duration||20)*60;
            renderDisplay();
            save();
          }else{
            stopBlindTimer();
            renderDisplay();
          }
        }
      },1000);
    };

    function stopBlindTimer(){ clearInterval(blindInterval); blindInterval=null; }

    window.togglePause = function(){
      blindPaused = !blindPaused;
      pauseBtn.textContent = blindPaused ? '▶ Resume' : '⸷ Pause';
    };

    window.resetAll = function(){
      // Reset timers only — do NOT clear or reinitialize user data
      stopBlindTimer();
      blindPaused=false; pauseBtn.textContent='⸷ Pause';
      // keep current blinds and index; just reset the blind timer to current level
      const cur = blinds[currentBlindIndex] || { duration: 20 };
      blindTimer = (cur.duration||20)*60;
      renderBlindTime();
      // keep shot length; just restart shot clock from full time
      shotStop();
      shotStart();
      // persist current state (without clearing storage)
      save();
      // refresh UI without altering user-entered values
      renderBlinds();
      renderDisplay();
    };

    function save(){
      localStorage.setItem('blinds', JSON.stringify(blinds));
      localStorage.setItem('currentBlindIndex', currentBlindIndex);
      localStorage.setItem('shotLen', shotLen);
    }

    function shotTick(){
      const now = performance.now();
      const remaining = Math.max(shotEnd - now, 0);
      const secs = Math.ceil(remaining/1000);
      if(secs !== lastShown){
        lastShown = secs;
        elShot.textContent = String(Math.max(secs,0)).padStart(2,'0');
        const pct = Math.max(remaining / (shotLen*1000), 0);
        const hue = Math.round(120*pct);
        document.body.style.backgroundColor = `hsl(${hue}, 45%, 25%)`;
      }
      if(remaining<=0){
        cancelAnimationFrame(rafId); rafId=null; return;
      }
      rafId = requestAnimationFrame(shotTick);
    }

    function shotStart(){
      const v = parseInt(inputShotLen.value||shotLen);
      if(v>0) { shotLen = v; save(); }
      shotEnd = performance.now() + shotLen*1000;
      lastShown=-1;
      if(rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(shotTick);
    }

    function shotStop(){ if(rafId) cancelAnimationFrame(rafId); rafId=null; }

    function shotReset(){
      shotEnd = performance.now() + shotLen*1000;
      lastShown=-1;
      if(!rafId) rafId = requestAnimationFrame(shotTick);
    }

    window.updateShotLength = function(){
      shotLen = parseInt(inputShotLen.value) || shotLen;
      localStorage.setItem('shotLen', shotLen);
      shotReset();
    };

    document.body.addEventListener('click', (e)=>{
      if(e.target.closest('input') || e.target.closest('button') || e.target.closest('#sidebar')) return;
      shotReset();
    });

    // Cleanup legacy key once (we do not store blindTimer explicitly)
    try { localStorage.removeItem('blindTimer'); } catch(_){ }

    renderBlinds();
    renderDisplay();
    shotStart();

    window.toggleFullscreen = function(){
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    };
    document.addEventListener('fullscreenchange', ()=>{
      const btn = document.getElementById('fsBtn');
      if(btn) btn.textContent = document.fullscreenElement ? '🡽 Exit Full Screen' : '⛶ Full Screen';
    });
  </script>
</body>
</html>
