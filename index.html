<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shot Clock + Blinds</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body { font-family: 'Noto Sans', sans-serif; }
    .slide-in { transition: transform .25s ease; }
    .hidden-sidebar { transform: translateX(-100%); }
    .visible-sidebar { transform: translateX(0); }
  </style>
</head>
<body class="h-full bg-gray-50 text-white">
  <!-- Sounds -->
  <audio id="alert1min" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
  <audio id="alertEnd" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>
  <audio id="shotBeep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <div class="flex h-screen">
    <!-- Sidebar (Blinds setup + Controls) -->
    <aside id="sidebar" class="slide-in hidden-sidebar fixed inset-y-0 left-0 z-40 w-120 max-w-[85vw] bg-gray-800/95 backdrop-blur p-4 overflow-auto shadow-2xl border-r border-white/10">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold">ตั้งค่า</h2>
        <button onclick="toggleSidebar()" class="px-2 py-1 rounded bg-white/10">⟨⟨</button>
      </div>

      <!-- Shot Clock Settings -->
      <section class="mb-6">
        <h3 class="text-lg font-semibold mb-2">Shot Clock</h3>
        <div class="space-y-2 text-sm">
          <label class="block">ความยาวต่อรอบ (วินาที)
            <input id="shotLen" type="number" min="5" class="w-full bg-gray-700 rounded px-2 py-1" />
          </label>
          <div class="flex gap-2">
        </div>
      </section>

      <!-- Blind Settings -->
      <section class="mb-6">
        <h3 class="text-lg font-semibold mb-2">ระดับ Blind</h3>
        <div id="blindsList" class="space-y-2"></div>
        <button onclick="addBlind()" class="mt-2 bg-indigo-800 px-4 py-2 rounded w-full">+ เพิ่ม Blind</button>
      </section>

      <!-- Timer Controls -->
      <section class="mb-2">
        <h3 class="text-lg font-semibold mb-2">ควบคุม Blind Timer</h3>
        <div class="flex gap-2">
          <button onclick="startBlindTimer()" class="flex-1 bg-blue-600 rounded px-3 py-2">▶ Start</button>
          <button onclick="togglePause()" id="pauseBtn" class="flex-1 bg-yellow-600 rounded px-3 py-2">⏸ Pause</button>
        </div>
        <button onclick="resetAll()" class="mt-2 w-full bg-rose-700 rounded px-3 py-2">⟲ Reset ทั้งหมด</button>
      </section>
    </aside>

    <!-- Main -->
    <main class="flex-1 relative flex flex-col items-center justify-center text-center px-4">
      <button onclick="toggleSidebar()" class="absolute top-4 left-4 bg-sky-600 hover:bg-sky-500 px-3 py-1 rounded shadow">☰</button>

      <!-- Shot Clock (ใหญ่) -->
      <div class="flex flex-col items-center select-none">
        <div id="shotTime" class="font-extrabold leading-none" style="font-size: clamp(12rem, 18vw, 28rem);">00</div>
      </div>

      <!-- Divider -->
      <div class="h-6 md:h-8"></div>

      <!-- Blinds (เล็กกว่า) -->
      <div class="w-full max-w-600px grid grid-cols-1 md:grid-cols-2 items-center gap-4 md:gap-6">
        <div class="md:col-span-1 order-2 md:order-1 bg-white/5 rounded-2xl p-4 md:p-6 backdrop-blur border border-white/10 shadow">
          <div class="text-sm uppercase tracking-wide text-white/70">ระดับปัจจุบัน</div>
          <div id="currentBlind" class="text-3xl sm:text-4xl md:text-5xl font-semibold break-words">SB 100 / BB 200</div>
          <div id="blindTime" class="mt-2 text-[2rem] sm:text-[2rem] md:text-[6rem] text-white/90">20:00</div>
        </div>
        <div class="md:col-span-1 order-3 md:order-2 text-white/70">
          <div class="text-sm uppercase tracking-wide">ถัดไป</div>
          <div id="nextBlind" class="text-[1.5rem] sm:text-[1.5rem] md:text-[4rem]">SB 200 / BB 400</div>
        </div>
        <div class="md:col-span-1 order-1 md:order-3 flex items-center justify-center gap-3">
          <button onclick="prevLevel()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl">◀</button>
          <div class="text-sm">เลเวลที่ <span id="levelIdx">1</span>/<span id="levelTotal">1</span></div>
          <button onclick="nextLevel()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl">▶</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ===== State =====
    let blinds = JSON.parse(localStorage.getItem('blinds')) || [
      { sb: 100, bb: 200, duration: 20 },
      { sb: 200, bb: 400, duration: 20 },
      { sb: 300, bb: 600, duration: 20 }
    ];
    let currentBlindIndex = parseInt(localStorage.getItem('currentBlindIndex') || '0');
    let blindTimer = (blinds[currentBlindIndex]?.duration || 20) * 60; // seconds
    let blindInterval = null;
    let blindPaused = false;

    // Shot clock
    let shotLen = parseInt(localStorage.getItem('shotLen') || '30');
    let shotEnd = 0;
    let rafId = null;
    let lastShown = -1;

    // ===== UI init =====
    const elShot = document.getElementById('shotTime');
    const elBlind = document.getElementById('blindTime');
    const elCur = document.getElementById('currentBlind');
    const elNext = document.getElementById('nextBlind');
    const elIdx = document.getElementById('levelIdx');
    const elTotal = document.getElementById('levelTotal');
    const pauseBtn = document.getElementById('pauseBtn');
    const inputShotLen = document.getElementById('shotLen');
    inputShotLen.value = shotLen;

    function toggleSidebar(){
      document.getElementById('sidebar').classList.toggle('visible-sidebar');
      document.getElementById('sidebar').classList.toggle('hidden-sidebar');
    }

    function addBlind(){
      blinds.push({ sb: 0, bb: 0, duration: 20 });
      save();
      renderBlinds();
      renderDisplay();
    }

    function deleteBlind(i){
      blinds.splice(i,1);
      currentBlindIndex = Math.max(0, Math.min(currentBlindIndex, blinds.length-1));
      save();
      renderBlinds();
      renderDisplay();
    }

    function moveBlind(i, dir){
      const j = i + dir;
      if (j < 0 || j >= blinds.length) return;
      const [item] = blinds.splice(i,1);
      blinds.splice(j,0,item);
      if (currentBlindIndex === i) currentBlindIndex = j;
      else if (currentBlindIndex === j) currentBlindIndex = i;
      save();
      renderBlinds();
      renderDisplay();
    }

    function updateBlind(i, key, val){
      blinds[i][key] = parseInt(val)||0;
      if(key==='duration' && i===currentBlindIndex){
        blindTimer = blinds[i].duration*60;
        renderBlindTime();
      }
      save();
    }

    function renderBlinds(){
      const list = document.getElementById('blindsList');
      list.innerHTML = '';
      blinds.forEach((b,i)=>{
        list.innerHTML += `
          <div class="flex items-center gap-2">
            SB <input type="number" value="${b.sb}" onchange="updateBlind(${i},'sb',this.value)" class="w-16 bg-gray-700 rounded px-2 py-1">
            BB <input type="number" value="${b.bb}" onchange="updateBlind(${i},'bb',this.value)" class="w-16 bg-gray-700 rounded px-2 py-1">
            Min <input type="number" value="${b.duration}" onchange="updateBlind(${i},'duration',this.value)" class="w-16 bg-gray-700 rounded px-2 py-1">
            <div class="ml-auto flex items-center gap-1">
              <button onclick="moveBlind(${i}, -1)" class="px-2 text-white/80 bg-white/10 rounded">▲</button>
              <button onclick="moveBlind(${i}, 1)" class="px-2 text-white/80 bg-white/10 rounded">▼</button>
              <button onclick="deleteBlind(${i})" class="px-3 py-1 text-white bg-red-600 hover:bg-red-700 rounded text-lg font-bold">✖</button>
            </div>
          </div>`;
      });
    }

    function renderDisplay(){
      elTotal.textContent = blinds.length;
      elIdx.textContent = Math.min(currentBlindIndex+1, blinds.length);
      const cur = blinds[currentBlindIndex] || {sb:0, bb:0, duration:0};
      const next = blinds[currentBlindIndex+1];
      const isBreak = cur.sb===0 && cur.bb===0;
      elCur.textContent = isBreak ? 'Break Time' : `${cur.sb} / ${cur.bb}`;
      elNext.textContent = next? `${next.sb} /${next.bb}` : 'เลเวลสุดท้าย';
      renderBlindTime();
    }

    function renderBlindTime(){
      const m = String(Math.floor(blindTimer/60)).padStart(2,'0');
      const s = String(blindTimer%60).padStart(2,'0');
      elBlind.textContent = `${m}:${s}`;
    }

    function startBlindTimer(){
      if(blindInterval) return;
      blindInterval = setInterval(()=>{
        if(blindPaused) return;
        if(blindTimer===60) document.getElementById('alert1min').play();
        if(blindTimer>0){
          blindTimer--;
          renderBlindTime();
        }else{
          document.getElementById('alertEnd').play();
          if(currentBlindIndex < blinds.length-1){
            currentBlindIndex++;
            blindTimer = (blinds[currentBlindIndex].duration||20)*60;
            renderDisplay();
          }else{
            stopBlindTimer();
          }
        }
      },1000);
    }

    function stopBlindTimer(){
      clearInterval(blindInterval); blindInterval=null;
    }

    function togglePause(){
      blindPaused = !blindPaused;
      pauseBtn.textContent = blindPaused ? '▶ Resume' : '⏸ Pause';
    }

    function prevLevel(){
      currentBlindIndex = Math.max(0, currentBlindIndex-1);
      blindTimer = (blinds[currentBlindIndex].duration||20)*60;
      save();
      renderDisplay();
    }
    function nextLevel(){
      currentBlindIndex = Math.min(blinds.length-1, currentBlindIndex+1);
      blindTimer = (blinds[currentBlindIndex].duration||20)*60;
      save();
      renderDisplay();
    }

    function resetAll(){
      // stop timers
      stopBlindTimer();
      blindPaused=false; pauseBtn.textContent='⏸ Pause';
      // reset stored data & UI back to defaults
      localStorage.clear();
      blinds = [
        { sb: 100, bb: 200, duration: 20 },
        { sb: 200, bb: 400, duration: 20 },
        { sb: 300, bb: 600, duration: 20 }
      ];
      currentBlindIndex=0;
      blindTimer = (blinds[0].duration)*60;
      shotLen = 30;
      inputShotLen.value = shotLen;
      save();
      renderBlinds();
      renderDisplay();
      // reset shot clock clean start
      shotStop();
      shotStart();
    }

    function save(){
      localStorage.setItem('blinds', JSON.stringify(blinds));
      localStorage.setItem('currentBlindIndex', currentBlindIndex);
      localStorage.setItem('shotLen', shotLen);
    }

    // ===== Shot clock (RAF) =====
    function shotTick(){
      const now = performance.now();
      const remaining = Math.max(shotEnd - now, 0);
      const secs = Math.ceil(remaining/1000);
      if(secs !== lastShown){
        lastShown = secs;
        elShot.textContent = String(Math.max(secs,0)).padStart(2,'0');
        // subtle hue from green->red on lighter bg
        const pct = Math.max(remaining / (shotLen*1000), 0);
        const hue = Math.round(120*pct);
        document.body.style.backgroundColor = `hsl(${hue}, 45%, 25%)`;
      }
      if(remaining<=0){
        document.getElementById('shotBeep').play();
        cancelAnimationFrame(rafId); rafId=null; return;
      }
      rafId = requestAnimationFrame(shotTick);
    }

    function shotStart(){
      // from input
      const v = parseInt(inputShotLen.value||shotLen);
      if(v>0) { shotLen = v; save(); }
      shotEnd = performance.now() + shotLen*1000;
      lastShown=-1;
      if(rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(shotTick);
    }

    function shotStop(){
      if(rafId) cancelAnimationFrame(rafId); rafId=null;
    }

    function shotReset(){
      shotEnd = performance.now() + shotLen*1000;
      lastShown=-1;
      if(!rafId) rafId = requestAnimationFrame(shotTick);
    }

    // Tap anywhere (outside inputs/buttons) to reset shot clock
    document.body.addEventListener('click', (e)=>{
      if(e.target.closest('input') || e.target.closest('button') || e.target.closest('#sidebar')) return;
      shotReset();
    });

    // ===== Boot =====
    renderBlinds();
    renderDisplay();
    shotStart();

  </script>
</body>
</html>
