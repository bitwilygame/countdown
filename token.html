<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วงล้อเสี่ยงโชค (Lucky Wheel)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }

        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .wheel-container {
                width: 400px;
                height: 400px;
            }
        }

        #canvas {
            width: 100%;
            height: 100%;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            /* Ease out custom */
            border-radius: 50%;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .arrow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ef4444;
            /* Red arrow */
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.3));
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center py-8">

    <div class="container mx-auto px-4 max-w-5xl">
        <h1 class="text-3xl md:text-4xl font-bold text-center text-indigo-600 mb-8">🎡 วงล้อสุ่มแจกรางวัล</h1>

        <div class="flex flex-col md:flex-row gap-8">

            <!-- Left Panel: Input & List -->
            <div class="w-full md:w-1/3 bg-white p-6 rounded-xl shadow-lg">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2">จัดการของรางวัล</h2>

                <!-- Input Form -->
                <div class="space-y-3 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">ชื่อรางวัล</label>
                        <input type="text" id="prizeName" placeholder="เช่น เงิน 100 บาท"
                            class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">จำนวนรางวัล (ชิ้น)</label>
                        <input type="number" id="prizeCount" placeholder="เช่น 3" min="1"
                            class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div class="flex gap-2">
                        <button onclick="addPrize()"
                            class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                            เพิ่มรางวัล
                        </button>
                    </div>
                </div>

                <!-- Prize List -->
                <div class="mb-4">
                    <h3 class="text-md font-semibold mb-2">รายการรางวัลที่เหลือ: <span id="totalItemsDisplay"
                            class="text-indigo-600">0</span> ชิ้น</h3>
                    <ul id="prizeList" class="space-y-2 max-h-60 overflow-y-auto pr-2">
                        <!-- Items will be injected here -->
                        <li class="text-center text-gray-400 py-4">ยังไม่มีรางวัล</li>
                    </ul>
                </div>

                <button onclick="resetAll()"
                    class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded transition duration-200 text-sm">
                    รีเซตทั้งหมด (เริ่มใหม่)
                </button>
            </div>

            <!-- Right Panel: The Wheel -->
            <div
                class="w-full md:w-2/3 flex flex-col items-center justify-center bg-white p-6 rounded-xl shadow-lg relative">

                <div class="wheel-container mb-6">
                    <div class="arrow"></div>
                    <canvas id="canvas" width="500" height="500"></canvas>
                </div>

                <button id="spinBtn" onclick="spinWheel()"
                    class="bg-amber-500 hover:bg-amber-600 text-white text-2xl font-bold py-3 px-12 rounded-full shadow-lg transform transition hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
                    หมุนวงล้อ!
                </button>
                <p class="mt-4 text-sm text-gray-500">* วงล้อจะปรับขนาดตามจำนวนรางวัลที่เหลืออยู่จริง</p>
            </div>
        </div>
    </div>

    <script>
        // State
        let prizes = [];
        let currentRotation = 0;
        let isSpinning = false;
        const colors = [
            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF',
            '#FF9F40', '#E7E9ED', '#8AC926', '#1982C4', '#6A4C93'
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');

        // Init
        window.onload = () => {
            loadFromStorage();
            drawWheel();
            updateUI();
        };

        // --- Core Logic ---

        function addPrize() {
            const nameInput = document.getElementById('prizeName');
            const countInput = document.getElementById('prizeCount');
            const name = nameInput.value.trim();
            const count = parseInt(countInput.value);

            if (!name || isNaN(count) || count <= 0) {
                Swal.fire({
                    icon: 'error',
                    title: 'ข้อมูลไม่ครบถ้วน',
                    text: 'กรุณาใส่ชื่อรางวัลและจำนวนรางวัลให้ถูกต้อง',
                    confirmButtonText: 'ตกลง'
                });
                return;
            }

            // Check duplicate name (optional: merge counts)
            const existingIndex = prizes.findIndex(p => p.name === name);
            if (existingIndex >= 0) {
                prizes[existingIndex].count += count;
            } else {
                prizes.push({
                    name: name,
                    count: count,
                    color: colors[prizes.length % colors.length]
                });
            }

            nameInput.value = '';
            countInput.value = '';
            saveToStorage();
            updateUI();
            drawWheel();
        }

        function getTotalCount() {
            return prizes.reduce((sum, p) => sum + p.count, 0);
        }

        function drawWheel() {
            const total = getTotalCount();
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (total === 0) {
                // Draw empty gray wheel
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#e5e7eb';
                ctx.fill();
                ctx.font = 'bold 30px Prompt';
                ctx.fillStyle = '#9ca3af';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('เพิ่มรางวัลเพื่อเริ่ม', centerX, centerY);
                return;
            }

            let startAngle = -Math.PI / 2; // Start at 12 o'clock

            prizes.forEach(prize => {
                if (prize.count > 0) {
                    // Calculate slice size based on proportion of remaining count
                    const sliceAngle = (prize.count / total) * 2 * Math.PI;
                    const endAngle = startAngle + sliceAngle;

                    // Draw Slice
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                    ctx.fillStyle = prize.color;
                    ctx.fill();
                    ctx.stroke();

                    // Draw Text
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(startAngle + sliceAngle / 2);
                    ctx.textAlign = "right";
                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 24px Prompt";
                    ctx.shadowColor = "rgba(0,0,0,0.5)";
                    ctx.shadowBlur = 4;

                    // Don't draw text if slice is too small
                    if (sliceAngle > 0.15) {
                        ctx.fillText(prize.name + ` (${prize.count})`, radius - 20, 10);
                    }

                    ctx.restore();

                    startAngle = endAngle;
                }
            });
        }

        function spinWheel() {
            if (isSpinning) return;
            const total = getTotalCount();
            if (total === 0) {
                Swal.fire('ไม่มีของรางวัล', 'กรุณาเพิ่มรางวัลก่อนหมุน', 'warning');
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;

            // 1. Determine Winner Logic (Weighted Random)
            let randomTicket = Math.floor(Math.random() * total);
            let winningPrizeIndex = -1;
            let currentTicketCount = 0;

            for (let i = 0; i < prizes.length; i++) {
                if (prizes[i].count > 0) {
                    currentTicketCount += prizes[i].count;
                    if (randomTicket < currentTicketCount) {
                        winningPrizeIndex = i;
                        break;
                    }
                }
            }

            // 2. Calculate Angle to stop at
            // We need to find the specific angle range for the winning item
            // Because we draw starting from -90deg (Top), we need to map logic accordingly.

            // Re-calculate the range angles
            let angleCursor = 0; // Relative to start (0 to 360)
            let winStartAngle = 0;
            let winEndAngle = 0;

            prizes.forEach((prize, index) => {
                if (prize.count > 0) {
                    const sliceDegrees = (prize.count / total) * 360;
                    if (index === winningPrizeIndex) {
                        winStartAngle = angleCursor;
                        winEndAngle = angleCursor + sliceDegrees;
                    }
                    angleCursor += sliceDegrees;
                }
            });

            // The target angle (where the pointer points) is top (270deg or -90deg in standard math, but CSS rotate is clockwise)
            // Let's assume Pointer is at Top (0 degrees CSS visual).
            // To make the winning slice stop at Top, we need to rotate the wheel such that the winning slice is at -90deg (or 270deg) in Canvas space?
            // Wait, simplier approach: 
            // Pointer is fixed at TOP.
            // Target angle on the wheel needs to land at -90deg (12 o'clock).

            const randomOffset = Math.random() * (winEndAngle - winStartAngle) * 0.8 + (winEndAngle - winStartAngle) * 0.1; // 10% padding
            const targetAngleInWheel = winStartAngle + randomOffset;

            // Current Rotation + Extra Spins + (360 - TargetAngle)
            // Example: Target is at 10 degrees. We want 10 degrees to be at Top (which is 0 degrees visually if we handled canvas rotation, but we handle DIV rotation).
            // Actually, Canvas draws 0 at 3 o'clock. We started drawing at -PI/2 (12 o'clock).
            // So 0 degrees in our logic IS 12 o'clock.
            // To get TargetAngle to 12 o'clock, we rotate the container by (360 - TargetAngle).

            const extraSpins = 360 * 5; // 5 full spins
            const finalRotation = currentRotation + extraSpins + (360 - targetAngleInWheel);

            // 3. Animate
            canvas.style.transform = `rotate(${finalRotation}deg)`;

            // 4. Handle End of Spin
            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                currentRotation = finalRotation % 360; // Keep numbers manageable

                handleWin(winningPrizeIndex);
            }, 4000); // Must match CSS transition time
        }

        function handleWin(index) {
            const winner = prizes[index];

            // Confetti
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });

            Swal.fire({
                title: 'ยินดีด้วย!',
                text: `คุณได้รับรางวัล: ${winner.name}`,
                icon: 'success',
                confirmButtonText: 'รับรางวัล',
                allowOutsideClick: false
            }).then(() => {
                // Decrement count
                prizes[index].count--;
                saveToStorage();

                // Reset Rotation visually to 0 (but keep canvas oriented if we wanted, 
                // but simpler to reset canvas drawing and reset rotation to 0 for next spin logic ease)
                // Actually, to make "area update" look good, we re-draw.

                // Reset CSS transform smoothly? No, instant reset is better for re-draw
                canvas.style.transition = 'none';
                canvas.style.transform = `rotate(0deg)`;
                currentRotation = 0;

                // Force reflow
                canvas.offsetHeight;

                // Restore transition
                canvas.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';

                updateUI();
                drawWheel();
            });
        }

        function updateUI() {
            const list = document.getElementById('prizeList');
            const totalDisplay = document.getElementById('totalItemsDisplay');
            list.innerHTML = '';

            let total = 0;
            prizes.forEach((p, i) => {
                if (p.count > 0) {
                    total += p.count;
                    const li = document.createElement('li');
                    li.className = 'flex justify-between items-center bg-gray-50 p-3 rounded border border-gray-200';
                    li.innerHTML = `
                        <div class="flex items-center gap-2">
                            <span class="w-4 h-4 rounded-full" style="background-color: ${p.color}"></span>
                            <span class="font-medium">${p.name}</span>
                        </div>
                        <span class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded">เหลือ ${p.count}</span>
                    `;
                    list.appendChild(li);
                }
            });

            totalDisplay.innerText = total;

            if (total === 0 && prizes.length > 0) {
                list.innerHTML = '<li class="text-center text-red-500 font-bold py-4">ของรางวัลหมดเกลี้ยงแล้ว!</li>';
            } else if (prizes.length === 0) {
                list.innerHTML = '<li class="text-center text-gray-400 py-4">ยังไม่มีรางวัล</li>';
            }
        }

        function resetAll() {
            Swal.fire({
                title: 'ยืนยันการล้างข้อมูล?',
                text: "ข้อมูลรางวัลทั้งหมดจะหายไปและเริ่มใหม่",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'ใช่, ล้างทั้งหมด',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    prizes = [];
                    currentRotation = 0;
                    canvas.style.transition = 'none';
                    canvas.style.transform = `rotate(0deg)`;
                    setTimeout(() => {
                        canvas.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
                    }, 50);

                    saveToStorage();
                    updateUI();
                    drawWheel();
                    Swal.fire(
                        'ล้างข้อมูลแล้ว!',
                        'เริ่มต้นใหม่เรียบร้อย',
                        'success'
                    );
                }
            });
        }

        // --- LocalStorage Helpers ---
        function saveToStorage() {
            localStorage.setItem('luckyWheelPrizes', JSON.stringify(prizes));
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('luckyWheelPrizes');
            if (saved) {
                try {
                    prizes = JSON.parse(saved);
                } catch (e) {
                    console.error("Error loading prizes", e);
                }
            }
        }
    </script>
</body>

</html>
