<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Poker Tournament & Prize Distribution with Token Pool Rewards</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 flex">
  <!-- Sidebar -->
  <div class="w-80 bg-white p-6 rounded-2xl shadow-md mr-6">
    <h2 class="text-xl font-bold mb-4">⚙️ การตั้งค่า</h2>

    <!-- ฟอร์มแรก กำหนด Buy-in และ Rake -->
    <form id="setupForm" class="space-y-4 mb-6">
      <div>
        <label class="block text-sm font-medium">ราคา Buy-in (฿)</label>
        <input type="number" id="buyIn" required class="w-full border rounded-lg px-3 py-2">
      </div>

      <div>
        <label class="block text-sm font-medium">Rake (฿)</label>
        <input type="number" id="rake" value="0" required class="w-full border rounded-lg px-3 py-2">
      </div>

      <div class="flex items-center space-x-2">
        <input type="checkbox" id="isToken" class="w-4 h-4">
        <label for="isToken" class="text-sm font-medium">Token?</label>
      </div>

      <div class="flex justify-end">
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 w-full">
          ✅ ยืนยัน
        </button>
      </div>
    </form>

    <!-- % การจ่ายรางวัล -->
    <h3 class="text-lg font-semibold mb-2">📊 การแบ่งรางวัล (%)</h3>
    <div id="percentages" class="space-y-2 mb-4"></div>
    <button id="addPercentage" class="w-full bg-blue-600 text-white py-1 rounded-lg hover:bg-blue-700">➕ เพิ่ม %</button>

    <!-- ฟอร์มกระจายรางวัลจาก Token Pool -->
    <h3 class="text-lg font-semibold mt-6 mb-2">🎲 กระจายรางวัลจาก Token Pool</h3>
    <form id="prizeForm" class="space-y-4">
      <div>
        <label class="block mb-1 font-medium">มูลค่ารางวัล (คั่นด้วย ,)</label>
        <input id="values" type="text" class="w-full p-2 border rounded-lg" placeholder="เช่น 20,40,100,500,1000">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
        คำนวดการกระจายรางวัล
      </button>
    </form>

    <!-- ปุ่มจัดการ -->
    <div class="flex flex-col space-y-2 mt-6">
      <button id="resetBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">🗑️ รีเซตข้อมูล</button>
      <button id="exportBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">📂 Export CSV</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 bg-white p-6 rounded-2xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">📋 รายชื่อผู้เล่น</h1>

    <!-- ฟอร์มเพิ่มผู้เล่น -->
    <form id="playerForm" class="grid grid-cols-1 gap-4 mb-6 hidden">
      <div>
        <label class="block text-sm font-medium">ชื่อผู้เล่น</label>
        <input type="text" id="playerName" required class="w-full border rounded-lg px-3 py-2">
      </div>

      <div class="flex justify-end">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
          ➕ เพิ่มผู้เล่น
        </button>
      </div>
    </form>

    <!-- ตารางแสดงผล -->
    <table class="w-full border-collapse mb-6">
      <thead>
        <tr class="bg-gray-200">
          <th class="border px-4 py-2 text-left">ชื่อผู้เล่น</th>
          <th class="border px-4 py-2 text-right">Buy-in (฿)</th>
          <th class="border px-4 py-2 text-right">Rake (฿)</th>
          <th class="border px-4 py-2 text-right">สุทธิ (฿)</th>
          <th class="border px-4 py-2 text-center">จ่ายแล้ว</th>
          <th class="border px-4 py-2 text-center">ลบ</th>
        </tr>
      </thead>
      <tbody id="buyinTable"></tbody>
      <tfoot>
        <tr class="bg-gray-100 font-bold">
          <td class="border px-4 py-2 text-right" colspan="5">💰 Prize Pool รวม</td>
          <td class="border px-4 py-2 text-right" id="prizePool">0</td>
        </tr>
        <tr class="bg-gray-100 font-bold">
          <td class="border px-4 py-2 text-right" colspan="5">🏦 Rake รวม</td>
          <td class="border px-4 py-2 text-right" id="totalRake">0</td>
        </tr>
      </tfoot>
    </table>

    <div id="rewardResult" class="mt-6 text-gray-800 font-medium"></div>
    <div id="tokenPrizeResult" class="mt-6 text-gray-800 font-medium"></div>
  </div>

  <script>
    const setupForm = document.getElementById("setupForm");
    const playerForm = document.getElementById("playerForm");
    const table = document.getElementById("buyinTable");
    const prizePoolCell = document.getElementById("prizePool");
    const totalRakeCell = document.getElementById("totalRake");
    const resetBtn = document.getElementById("resetBtn");
    const exportBtn = document.getElementById("exportBtn");
    const isTokenCheck = document.getElementById("isToken");
    const percentagesDiv = document.getElementById("percentages");
    const addPercentageBtn = document.getElementById("addPercentage");
    const rewardResult = document.getElementById("rewardResult");
    const prizeForm = document.getElementById("prizeForm");
    const tokenPrizeResult = document.getElementById("tokenPrizeResult");

    let buyInValue = 0;
    let rakeValue = 0;
    let prizePool = 0;
    let totalRake = 0;
    let players = [];
    let isToken = false;
    let percentages = [50, 30, 20];

    // ใช้ LocalStorage เพื่อเก็บข้อมูลให้คงอยู่เมื่อรีเฟรชหรือเปิดหน้าใหม่
    const STORAGE_KEY = "tourData";

    window.onload = function() {
      loadData();
    }

    function saveData() {
      const data = { buyInValue, rakeValue, players, prizePool, totalRake, isToken, percentages };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.error("ไม่สามารถบันทึกข้อมูลได้", e);
      }
    }

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const data = JSON.parse(saved);
          buyInValue = data.buyInValue || 0;
          rakeValue = data.rakeValue || 0;
          players = data.players || [];
          prizePool = data.prizePool || 0;
          totalRake = data.totalRake || 0;
          isToken = data.isToken || false;
          percentages = data.percentages || [50, 30, 20];

          document.getElementById("buyIn").value = buyInValue || "";
          document.getElementById("rake").value = rakeValue || 0;
          isTokenCheck.checked = isToken;

          if (buyInValue > 0) {
            setupForm.classList.add("hidden");
            playerForm.classList.remove("hidden");
          }
        } catch (e) {
          console.error("ไม่สามารถโหลดข้อมูลที่บันทึกได้", e);
        }
      }
      renderPercentages();
      renderTable();
    }

    function renderPercentages() {
      percentagesDiv.innerHTML = "";
      percentages.forEach((p, i) => {
        const div = document.createElement("div");
        div.className = "flex items-center space-x-2";
        div.innerHTML = `
          <input type="number" value="${p}" class="percentInput w-16 border rounded px-2 py-1" min="0" max="100"> %
          <button class="removeBtn bg-red-500 text-white px-2 py-1 rounded text-xs" ${percentages.length <= 1 ? 'disabled' : ''}>ลบ</button>
        `;
        
        const removeBtn = div.querySelector(".removeBtn");
        if (percentages.length <= 1) {
          removeBtn.classList.add("opacity-50", "cursor-not-allowed");
        } else {
          removeBtn.addEventListener("click", () => {
            percentages.splice(i, 1);
            renderPercentages();
            calculateRewards();
            saveData();
          });
        }
        
        div.querySelector(".percentInput").addEventListener("input", e => {
          const value = parseFloat(e.target.value);
          if (!isNaN(value) && value >= 0 && value <= 100) {
            percentages[i] = value;
            calculateRewards();
            saveData();
          }
        });
        percentagesDiv.appendChild(div);
      });
      
      // แสดงผลรวม %
      const totalPercent = percentages.reduce((sum, p) => sum + p, 0);
      const totalDiv = document.createElement("div");
      totalDiv.className = "text-sm font-medium mt-2 " + (totalPercent === 100 ? "text-green-600" : "text-red-600");
      totalDiv.textContent = `รวม: ${totalPercent}%`;
      percentagesDiv.appendChild(totalDiv);
    }

    addPercentageBtn.addEventListener("click", () => {
      percentages.push(10);
      renderPercentages();
      saveData();
    });

    function calculateRewards() {
      if (prizePool <= 0) {
        rewardResult.innerHTML = "";
        return;
      }

      rewardResult.innerHTML = "";

      if (!isToken) {
        rewardResult.innerHTML += `<h2 class='text-lg font-bold mb-2'>🏆 รางวัล (100% ของ Prizepool)</h2>`;
        let totalDistributed = 0;
        percentages.forEach((p, i) => {
          const amount = (prizePool * (p / 100));
          totalDistributed += amount;
          rewardResult.innerHTML += `<p>${i+1}st: ${p}% = ${amount.toFixed(2)} ฿</p>`;
        });
        rewardResult.innerHTML += `<p class='text-sm text-gray-600 mt-2'>รวมจ่าย: ${totalDistributed.toFixed(2)} ฿</p>`;
      } else {
        const tokenPool = prizePool * 0.5;
        const rankPool = prizePool * 0.5;

        rewardResult.innerHTML += `<h2 class='text-lg font-bold mb-2'>🏆 รางวัล Token Pool</h2>`;
        rewardResult.innerHTML += `<p>Token Pool: ${tokenPool.toFixed(2)} ฿</p>`;

        rewardResult.innerHTML += `<h2 class='text-lg font-bold mt-4 mb-2'>🏆 รางวัลอันดับ (50% ของ Prizepool)</h2>`;
        let totalDistributed = 0;
        percentages.forEach((p, i) => {
          const amount = (rankPool * (p / 100));
          totalDistributed += amount;
          rewardResult.innerHTML += `<p>${i+1}st: ${p}% = ${amount.toFixed(2)} ฿</p>`;
        });
        rewardResult.innerHTML += `<p class='text-sm text-gray-600 mt-2'>รวมจ่าย: ${totalDistributed.toFixed(2)} ฿</p>`;
      }
    }

    function renderTable() {
      table.innerHTML = "";
      players.forEach((p, index) => {
        const row = document.createElement("tr");
        row.className = p.paid ? "bg-green-100" : "hover:bg-yellow-100";
        row.innerHTML = `
          <td class="border px-4 py-2">${p.name}</td>
          <td class="border px-4 py-2 text-right">${buyInValue.toLocaleString()}</td>
          <td class="border px-4 py-2 text-right">${rakeValue.toLocaleString()}</td>
          <td class="border px-4 py-2 text-right font-semibold">${(buyInValue - rakeValue).toLocaleString()}</td>
          <td class="border px-4 py-2 text-center"><input type="checkbox" class="paidCheck" ${p.paid ? "checked" : ""}></td>
          <td class="border px-4 py-2 text-center"><button class="deleteBtn bg-red-500 text-white px-2 py-1 rounded text-xs">ลบ</button></td>
        `;

        row.querySelector(".paidCheck").addEventListener("change", function(e) {
          players[index].paid = e.target.checked;
          saveData();
          renderTable();
        });

        row.querySelector(".deleteBtn").addEventListener("click", function() {
          if (confirm(`ต้องการลบ ${p.name} หรือไม่?`)) {
            players.splice(index, 1);
            prizePool -= (buyInValue - rakeValue);
            totalRake -= rakeValue;
            saveData();
            renderTable();
            calculateRewards();
          }
        });
        table.appendChild(row);
      });
      
      prizePoolCell.textContent = prizePool.toLocaleString();
      totalRakeCell.textContent = totalRake.toLocaleString();
      calculateRewards();
      saveData();
    }

    setupForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const buyInInput = parseFloat(document.getElementById("buyIn").value);
      const rakeInput = parseFloat(document.getElementById("rake").value);
      
      if (buyInInput <= 0) {
        alert("กรุณาใส่ค่า Buy-in ที่มากกว่า 0");
        return;
      }
      
      if (rakeInput < 0) {
        alert("Rake ต้องไม่ติดลบ");
        return;
      }
      
      if (rakeInput >= buyInInput) {
        alert("Rake ต้องน้อยกว่า Buy-in");
        return;
      }

      buyInValue = buyInInput;
      rakeValue = rakeInput;
      isToken = isTokenCheck.checked;

      setupForm.classList.add("hidden");
      playerForm.classList.remove("hidden");
      renderTable();
      saveData();
    });

    playerForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("playerName").value.trim();
      
      if (!name) {
        alert("กรุณาใส่ชื่อผู้เล่น");
        return;
      }
      
      // ตรวจสอบชื่อซ้ำ
      if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
        alert("มีชื่อนี้อยู่แล้ว");
        return;
      }
      
      players.push({ name, paid: false });
      prizePool += (buyInValue - rakeValue);
      totalRake += rakeValue;
      saveData();
      renderTable();
      playerForm.reset();
    });

    resetBtn.addEventListener("click", function() {
      if (confirm("คุณต้องการรีเซตข้อมูลทั้งหมดหรือไม่?")) {
        // Reset ค่าทั้งหมด
        buyInValue = 0;
        rakeValue = 0;
        prizePool = 0;
        totalRake = 0;
        players = [];
        isToken = false;
        percentages = [50, 30, 20];
        
        // Reset UI
        setupForm.classList.remove("hidden");
        playerForm.classList.add("hidden");
        setupForm.reset();
        playerForm.reset();
        
        renderPercentages();
        renderTable();
        
        rewardResult.innerHTML = "";
        tokenPrizeResult.innerHTML = "";
      }
    });

    exportBtn.addEventListener("click", function() {
      if (players.length === 0) {
        alert("ไม่มีข้อมูลสำหรับ Export");
        return;
      }
      
      let csv = "ชื่อผู้เล่น,Buy-in,Rake,สุทธิ,จ่ายแล้ว\n";
      players.forEach(p => {
        csv += `${p.name},${buyInValue},${rakeValue},${buyInValue - rakeValue},${p.paid ? "Yes" : "No"}\n`;
      });
      csv += `\nPrize Pool รวม,,,,${prizePool}`;
      csv += `\nRake รวม,,,,${totalRake}`;

      if (!isToken) {
        csv += `\n\nรางวัลปกติ:`;
        percentages.forEach((p, i) => {
          csv += `\n${i+1}st,${p}%,,,,${(prizePool * (p/100)).toFixed(2)}`;
        });
      } else {
        csv += `\nToken Pool (50%),,,,${(prizePool*0.5).toFixed(2)}`;
        csv += `\n\nรางวัลอันดับ (50%):`;
        percentages.forEach((p, i) => {
          csv += `\n${i+1}st,${p}%,,,,${(prizePool*0.5 * (p/100)).toFixed(2)}`;
        });
      }

      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `poker_data_${new Date().toISOString().split('T')[0]}.csv`);
      link.click();
      URL.revokeObjectURL(url);
    });

    // ---------------- คำนวดรางวัลจาก Token Pool ----------------
    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    prizeForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      if (!isToken) {
        tokenPrizeResult.innerHTML = `<p class='text-red-600 bg-red-50 p-3 rounded'>ต้องเลือก Token ก่อนถึงจะคำนวดได้</p>`;
        return;
      }
      
      if (players.length === 0) {
        tokenPrizeResult.innerHTML = `<p class='text-red-600 bg-red-50 p-3 rounded'>ไม่มีผู้เล่น</p>`;
        return;
      }

      const total = prizePool * 0.5; // ใช้ Token Pool
      const count = Math.max(1, players.length - 1); // จำนวนรางวัล = (จำนวน buy-in - 1) แต่ต้องมีอย่างน้อย 1
      const valuesInput = document.getElementById('values').value.trim();
      
      if (!valuesInput) {
        tokenPrizeResult.innerHTML = `<p class='text-red-600 bg-red-50 p-3 rounded'>กรุณาใส่มูลค่ารางวัล</p>`;
        return;
      }
      
      const values = valuesInput.split(',')
                        .map(v => parseInt(v.trim()))
                        .filter(v => !isNaN(v) && v > 0);
      
      if (values.length === 0) {
        tokenPrizeResult.innerHTML = `<p class='text-red-600 bg-red-50 p-3 rounded'>กรุณาใส่มูลค่ารางวัลที่ถูกต้อง</p>`;
        return;
      }

      let bestDistribution = null;
      let bestDiff = Infinity;

      // ทดสอบหาการแจกที่ใกล้เคียงที่สุด
      for (let trial = 0; trial < 5000; trial++) {
        let distribution = {};
        let sum = 0;

        for (let i = 0; i < count; i++) {
          let prize = getRandomItem(values);
          distribution[prize] = (distribution[prize] || 0) + 1;
          sum += prize;
        }

        let diff = Math.abs(total - sum);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestDistribution = { dist: distribution, sum: sum, diff: diff };
        }

        // หากได้ผลลัพธ์ที่สมบูรณ์แบบแล้ว ให้หยุด
        if (diff === 0) break;
      }

      if (bestDistribution) {
        let resultHTML = `
          <div class='bg-blue-50 p-4 rounded-lg'>
            <h3 class='text-lg font-bold mb-3'>🎯 ผลการกระจายรางวัล Token Pool</h3>
            <div class='grid grid-cols-2 gap-4 mb-4'>
              <div>
                <p><strong>Token Pool:</strong> ${total.toFixed(2)} ฿</p>
                <p><strong>จำนวนรางวัล:</strong> ${count} รางวัล</p>
              </div>
              <div>
                <p><strong>รวมมูลค่าจ่าย:</strong> ${bestDistribution.sum.toFixed(2)} ฿</p>
                <p><strong>ส่วนต่าง:</strong> ${bestDistribution.diff.toFixed(2)} ฿</p>
              </div>
            </div>
            <h4 class='font-semibold mb-2'>การแจกรางวัล:</h4>
            <div class='space-y-1'>
        `;

        // แสดงผลการแจก
        Object.keys(bestDistribution.dist)
          .sort((a, b) => parseInt(b) - parseInt(a))
          .forEach(prize => {
            const count = bestDistribution.dist[prize];
            resultHTML += `<p>• รางวัล ${prize} ฿ × ${count} รางวัล = ${(prize * count).toFixed(2)} ฿</p>`;
          });

        resultHTML += `
            </div>
          </div>
        `;

        tokenPrizeResult.innerHTML = resultHTML;
      } else {
        tokenPrizeResult.innerHTML = `<p class='text-red-600 bg-red-50 p-3 rounded'>ไม่สามารถคำนวดได้</p>`;
      }
    });
  </script>
</body>
</html>
