<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Poker Tournament & Prize Distribution with Sidebar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 flex">
  <!-- Sidebar -->
  <div class="w-80 bg-white p-6 rounded-2xl shadow-md mr-6">
    <h2 class="text-xl font-bold mb-4">⚙️ การตั้งค่า</h2>

    <!-- ฟอร์มแรก กำหนด Buy-in และ Rake -->
    <form id="setupForm" class="space-y-4 mb-6">
      <div>
        <label class="block text-sm font-medium">ราคา Buy-in (฿)</label>
        <input type="number" id="buyIn" required class="w-full border rounded-lg px-3 py-2">
      </div>

      <div>
        <label class="block text-sm font-medium">Rake (฿)</label>
        <input type="number" id="rake" value="0" required class="w-full border rounded-lg px-3 py-2">
      </div>

      <div class="flex items-center space-x-2">
        <input type="checkbox" id="isToken" class="w-4 h-4">
        <label for="isToken" class="text-sm font-medium">Token?</label>
      </div>

      <div class="flex justify-end">
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 w-full">
          ✅ ยืนยัน
        </button>
      </div>
    </form>

    <!-- % การจ่ายรางวัล -->
    <h3 class="text-lg font-semibold mb-2">📊 การแบ่งรางวัล (%)</h3>
    <div id="percentages" class="space-y-2 mb-4"></div>
    <button id="addPercentage" class="w-full bg-blue-600 text-white py-1 rounded-lg hover:bg-blue-700">➕ เพิ่ม %</button>

    <!-- ปุ่มจัดการ -->
    <div class="flex flex-col space-y-2 mt-6">
      <button id="resetBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">🗑️ รีเซตข้อมูล</button>
      <button id="exportBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">📂 Export CSV</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 bg-white p-6 rounded-2xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">📋 รายชื่อผู้เล่น</h1>

    <!-- ฟอร์มเพิ่มผู้เล่น -->
    <form id="playerForm" class="grid grid-cols-1 gap-4 mb-6 hidden">
      <div>
        <label class="block text-sm font-medium">ชื่อผู้เล่น</label>
        <input type="text" id="playerName" required class="w-full border rounded-lg px-3 py-2">
      </div>

      <div class="flex justify-end">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
          ➕ เพิ่มผู้เล่น
        </button>
      </div>
    </form>

    <!-- ตารางแสดงผล -->
    <table class="w-full border-collapse mb-6">
      <thead>
        <tr class="bg-gray-200">
          <th class="border px-4 py-2 text-left">ชื่อผู้เล่น</th>
          <th class="border px-4 py-2 text-right">Buy-in (฿)</th>
          <th class="border px-4 py-2 text-right">Rake (฿)</th>
          <th class="border px-4 py-2 text-right">สุทธิ (฿)</th>
          <th class="border px-4 py-2 text-center">จ่ายแล้ว</th>
          <th class="border px-4 py-2 text-center">ลบ</th>
        </tr>
      </thead>
      <tbody id="buyinTable"></tbody>
      <tfoot>
        <tr class="bg-gray-100 font-bold">
          <td class="border px-4 py-2 text-right" colspan="5">💰 Prize Pool รวม</td>
          <td class="border px-4 py-2 text-right" id="prizePool">0</td>
        </tr>
        <tr class="bg-gray-100 font-bold">
          <td class="border px-4 py-2 text-right" colspan="5">🏦 Rake รวม</td>
          <td class="border px-4 py-2 text-right" id="totalRake">0</td>
        </tr>
      </tfoot>
    </table>

    <div id="rewardResult" class="mt-6 text-gray-800 font-medium"></div>
  </div>

  <script>
    const setupForm = document.getElementById("setupForm");
    const playerForm = document.getElementById("playerForm");
    const table = document.getElementById("buyinTable");
    const prizePoolCell = document.getElementById("prizePool");
    const totalRakeCell = document.getElementById("totalRake");
    const resetBtn = document.getElementById("resetBtn");
    const exportBtn = document.getElementById("exportBtn");
    const isTokenCheck = document.getElementById("isToken");
    const percentagesDiv = document.getElementById("percentages");
    const addPercentageBtn = document.getElementById("addPercentage");
    const rewardResult = document.getElementById("rewardResult");

    let buyInValue = 0;
    let rakeValue = 0;
    let prizePool = 0;
    let totalRake = 0;
    let players = [];
    let isToken = false;
    let percentages = [50, 30, 20];

    // โหลดข้อมูลจาก LocalStorage
    window.onload = function() {
      const savedData = localStorage.getItem("pokerData");
      if (savedData) {
        const data = JSON.parse(savedData);
        buyInValue = data.buyInValue;
        rakeValue = data.rakeValue;
        players = data.players;
        prizePool = data.prizePool;
        totalRake = data.totalRake;
        isToken = data.isToken;
        percentages = data.percentages || percentages;

        isTokenCheck.checked = isToken;
        setupForm.classList.add("hidden");
        playerForm.classList.remove("hidden");
        renderTable();
        renderPercentages();
      } else {
        renderPercentages();
      }
    }

    function saveData() {
      const data = { buyInValue, rakeValue, players, prizePool, totalRake, isToken, percentages };
      localStorage.setItem("pokerData", JSON.stringify(data));
    }

    function renderPercentages() {
      percentagesDiv.innerHTML = "";
      percentages.forEach((p, i) => {
        const div = document.createElement("div");
        div.className = "flex items-center space-x-2";
        div.innerHTML = `
          <input type="number" value="${p}" class="percentInput w-16 border rounded px-2 py-1"> %
          <button class="removeBtn bg-red-500 text-white px-2 py-1 rounded">ลบ</button>
        `;
        div.querySelector(".removeBtn").addEventListener("click", () => {
          percentages.splice(i, 1);
          renderPercentages();
          calculateRewards();
          saveData();
        });
        div.querySelector(".percentInput").addEventListener("input", e => {
          percentages[i] = parseFloat(e.target.value) || 0;
          calculateRewards();
          saveData();
        });
        percentagesDiv.appendChild(div);
      });
    }

    addPercentageBtn.addEventListener("click", () => {
      percentages.push(0);
      renderPercentages();
      saveData();
    });

    function calculateRewards() {
      if (prizePool <= 0) {
        rewardResult.innerHTML = "";
        return;
      }

      rewardResult.innerHTML = "";

      if (!isToken) {
        rewardResult.innerHTML += `<h2 class='text-lg font-bold mb-2'>🏆 รางวัล (100% ของ Prizepool)</h2>`;
        percentages.forEach((p, i) => {
          const amount = (prizePool * (p / 100)).toFixed(2);
          rewardResult.innerHTML += `<p>${i+1}st: ${p}% = ${amount} ฿</p>`;
        });
      } else {
        const tokenPool = prizePool * 0.5;
        const rankPool = prizePool * 0.5;

        rewardResult.innerHTML += `<h2 class='text-lg font-bold mb-2'>🏆 รางวัล Token (50% ของ Prizepool)</h2>`;
        rewardResult.innerHTML += `<p>Token Pool: ${tokenPool.toFixed(2)} ฿</p>`;

        rewardResult.innerHTML += `<h2 class='text-lg font-bold mt-4 mb-2'>🏆 รางวัลอันดับ (50% ของ Prizepool)</h2>`;
        percentages.forEach((p, i) => {
          const amount = (rankPool * (p / 100)).toFixed(2);
          rewardResult.innerHTML += `<p>${i+1}st: ${p}% = ${amount} ฿</p>`;
        });
      }
    }

    function renderTable() {
      table.innerHTML = "";
      players.forEach((p, index) => {
        const row = document.createElement("tr");
        row.className = p.paid ? "bg-green-100" : "";
        row.innerHTML = `
          <td class="border px-4 py-2">${p.name}</td>
          <td class="border px-4 py-2 text-right">${buyInValue.toLocaleString()}</td>
          <td class="border px-4 py-2 text-right">${rakeValue.toLocaleString()}</td>
          <td class="border px-4 py-2 text-right font-semibold">${(buyInValue - rakeValue).toLocaleString()}</td>
          <td class="border px-4 py-2 text-center"><input type="checkbox" class="paidCheck" ${p.paid ? "checked" : ""}></td>
          <td class="border px-4 py-2 text-center"><button class="deleteBtn bg-red-500 text-white px-2 py-1 rounded">ลบ</button></td>
        `;

        // เช็คจ่ายแล้ว auto save + ไฮไลท์สีเขียว
        row.querySelector(".paidCheck").addEventListener("change", function(e) {
          players[index].paid = e.target.checked;
          saveData();
          renderTable();
        });

        // ปุ่มลบ
        row.querySelector(".deleteBtn").addEventListener("click", function() {
          players.splice(index, 1);
          prizePool -= (buyInValue - rakeValue);
          totalRake -= rakeValue;
          saveData();
          renderTable();
          calculateRewards();
        });
        table.appendChild(row);
      });
      prizePoolCell.textContent = prizePool.toLocaleString();
      totalRakeCell.textContent = totalRake.toLocaleString();
      calculateRewards();
      saveData();
    }

    setupForm.addEventListener("submit", function(e) {
      e.preventDefault();
      buyInValue = parseFloat(document.getElementById("buyIn").value);
      rakeValue = parseFloat(document.getElementById("rake").value);
      isToken = isTokenCheck.checked;

      if (buyInValue > 0) {
        setupForm.classList.add("hidden");
        playerForm.classList.remove("hidden");
        renderTable();
        saveData();
      }
    });

    playerForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("playerName").value;
      players.push({ name, paid: false });
      prizePool += (buyInValue - rakeValue);
      totalRake += rakeValue;
      saveData();
      renderTable();
      playerForm.reset();
    });

    resetBtn.addEventListener("click", function() {
      if (confirm("คุณต้องการรีเซตข้อมูลทั้งหมดหรือไม่?")) {
        localStorage.removeItem("pokerData");
        location.reload();
      }
    });

    exportBtn.addEventListener("click", function() {
      let csv = "ชื่อผู้เล่น,Buy-in,Rake,สุทธิ,จ่ายแล้ว\\n";
      players.forEach(p => {
        csv += `${p.name},${buyInValue},${rakeValue},${buyInValue - rakeValue},${p.paid ? "Yes" : "No"}\\n`;
      });
      csv += `\nPrize Pool รวม,,,,${prizePool}`;
      csv += `\nRake รวม,,,,${totalRake}`;

      if (!isToken) {
        percentages.forEach((p, i) => {
          csv += `\n${i+1}st,${p}%,,,,${(prizePool * (p/100)).toFixed(2)}`;
        });
      } else {
        csv += `\nToken Pool (50%),,,,${(prizePool*0.5).toFixed(2)}`;
        percentages.forEach((p, i) => {
          csv += `\n${i+1}st,${p}%,,,,${(prizePool*0.5 * (p/100)).toFixed(2)}`;
        });
      }

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", "poker_data.csv");
      link.click();
    });
  </script>
</body>
</html>
